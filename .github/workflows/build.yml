name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: 📋 Flutter Doctor
        run: flutter doctor -v

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🧹 Clean
        run: flutter clean

      - name: 📦 Get Dependencies Again
        run: flutter pub get

      - name: 🏗️ Build APK
        run: |
          flutter build apk \
            --release \
            --no-obfuscate \
            --no-shrink \
            --no-tree-shake-icons

      - name: ✅ Check APK exists
        run: ls -la build/app/outputs/flutter-apk/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🎉 Done!
        run: echo "✅ APK Built Successfully!"
